name: Build plugin

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MobLookMultiply
          path: target/MobLookMultiply-*.jar
      - name: Read plugin version
        id: version
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.ref == 'refs/heads/master' && !endsWith(steps.version.outputs.version, '-SNAPSHOT')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MobLookMultiply ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: target/MobLookMultiply-*.jar
          generate_release_notes: true
